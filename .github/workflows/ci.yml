name: CI

on:
  push:
    branches: [main, feat/web-backend, feat/web-frontend, feat/e2e-tests]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - run: uv sync --extra app
      - run: uv run pytest -q

  frontend-tests:
    name: Frontend (vitest + tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/frontend/package-lock.json }
      - run: npm ci
        working-directory: app/frontend
      - run: npx tsc --noEmit
        working-directory: app/frontend
      - run: npm run test
        working-directory: app/frontend

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - run: uv sync
      - run: uv run ruff check src/ app/backend/

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install backend deps
        run: uv sync --extra app
      - name: Install frontend deps
        run: npm ci
        working-directory: app/frontend
      - name: Build frontend
        run: npm run build
        working-directory: app/frontend
      - name: Install Playwright + Chromium
        run: npm ci && npx playwright install --with-deps chromium
        working-directory: app/e2e
      - name: Start backend
        run: uv run cv-app &
        env:
          CV_PROJECT_ROOT: ${{ github.workspace }}
      - name: Wait for backend
        run: npx wait-on http://localhost:8000/api/health
        working-directory: app/e2e
      - name: Run E2E tests
        run: npx playwright test
        working-directory: app/e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: app/e2e/playwright-report/
